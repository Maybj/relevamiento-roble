<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Relevamiento Roble</title>

<style>
/* Herramienta de trabajo de Mayra para usar en tablet: controles grandes, una columna, agenda del puesto. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --ink:#0F1B3A; --muted:#566282; --line:#D7DEEB;
  --blue:#2270B4; --teal:#14806F; --accent:#C9511A; --on-accent:#FFFFFF; --soft:#E8EDF8; --warn:#A33A12;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1430; --surface:#111D3F; --ink:#EAEFFA; --muted:#9BA8C8; --line:#25345E;
    --blue:#74B4EC; --teal:#4CC9B0; --accent:#FF8A4C; --on-accent:#0A1430; --soft:#18264D; --warn:#FFA27A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1430; --surface:#111D3F; --ink:#EAEFFA; --muted:#9BA8C8; --line:#25345E;
  --blue:#74B4EC; --teal:#4CC9B0; --accent:#FF8A4C; --on-accent:#0A1430; --soft:#18264D; --warn:#FFA27A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(26px,5vw,36px);font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand .logo{background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;line-height:0}
.brand .logo img{height:34px;width:auto}
.brand .sp{flex:1}
.lead{color:var(--muted);max-width:64ch}
.status{font-size:13px;color:var(--muted);min-height:20px}
.status.err{color:var(--warn)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.step{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:56px}
.step b{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.step span{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.step[aria-current="step"]{border-color:var(--blue);box-shadow:inset 0 -3px 0 var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:16px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card.example{border-style:dashed;background:transparent;position:relative}
.badge{position:absolute;top:-10px;left:14px;background:var(--soft);color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.row{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:12px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:0}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;min-width:0;min-height:46px}
input[type="time"]{font-family:var(--f-mono)}
textarea{min-height:90px;resize:vertical}
input:disabled,select:disabled{opacity:1;color:var(--ink)}
.x,.mv{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;flex:none}
.x:hover{color:var(--warn);border-color:var(--warn)}.x.armed{background:var(--warn);border-color:var(--warn);color:#fff}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:11px 16px;min-height:46px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:8px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:9px 14px;min-height:42px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--bg);font-weight:600}
.chip.warn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.note{font-size:13px;color:var(--muted)}
.meta{font-size:13px;color:var(--muted)}
.person{display:flex;gap:12px;align-items:center;justify-content:space-between;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;min-height:64px}
.person:hover{border-color:var(--blue)}
.person .n{font-weight:600;font-size:17px}
.person .m{font-size:13px;color:var(--muted)}
.tpick{display:flex;gap:12px;align-items:center;justify-content:space-between;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:60px}
.tpick:hover{border-color:var(--blue)}
.tpick .d{font-weight:600;overflow-wrap:anywhere}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;background:var(--soft);color:var(--muted);padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.on{background:var(--blue);color:var(--bg)}
.tag.star{background:var(--accent);color:var(--on-accent)}
.stepcard{display:grid;grid-template-columns:34px minmax(0,1fr) 44px;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stepcard .num{font-family:var(--f-mono);font-size:15px;color:var(--blue);padding-top:10px;font-weight:500}
.stepcard .side{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.bar{display:grid;grid-template-columns:minmax(110px,200px) minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar .fl{height:100%;border-radius:6px;min-width:2px;background:var(--blue)}
.bar .v{text-align:right;color:var(--muted);font-size:13px}
.sumlist{margin:0;padding-left:20px}.sumlist li{margin:4px 0}
.ok{background:var(--soft);border-radius:12px;padding:14px;font-weight:500}
@media (max-width:600px){
  .steps{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:minmax(0,1fr) 44px}
  .row .time{grid-column:1/2}
  .row .fields{grid-column:1/2}
  .row .x{grid-column:2;grid-row:1}
  .fields.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{grid-template-columns:minmax(0,1fr) 70px}
  .bar .tr{grid-column:1/-1;grid-row:2}
}
</style></head><body>

<div class="wrap">
  <div class="brand" id="brand"></div>
  <p class="status" id="status" role="status"></p>
  <main id="app"></main>
</div>

    try{await syncAll();setStatus("Conectado a la nube. Todo se guarda solo.")}catch(e){setStatus("Conectado, pero no se pudo sincronizar. Probá de nuevo.",true)}
    render();return true;
  }
  async function conectar(){
    if(!sb||cloud.ok||cloud.busy)return;cloud.busy=true;
    try{var s=await sb.auth.getSession();var u=s.data&&s.data.session&&s.data.session.user;if(u)await activar(u)}catch(e){}
    cloud.busy=false;
  }
  async function cloudAct(act,b){
    if(!sb){cloud.msg="No se pudo cargar el servicio en la nube. Revisá la conexión y recargá.";render();return}
    var em=(document.getElementById("lg-e")||{}).value||"",pw=(document.getElementById("lg-p")||{}).value||"";
    try{
      if(act==="login"||act==="signup"){
        if(!em||!pw){cloud.msg="Escribí el mail y la contraseña.";render();return}
        b.disabled=true;b.textContent="Un momento…";
        var r=act==="login"?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});
        if(r.error){cloud.msg=r.error.message;render();return}
        if(r.data&&r.data.session){await activar(r.data.session.user)}
        else{cloud.msg="Te mandé un mail para confirmar la cuenta. Confirmalo y después tocá Ingresar.";render()}
      }
      if(act==="logout"){await sb.auth.signOut();cloud.ok=false;cloud.email="";setStatus("Sesión cerrada. Las fichas siguen en esta tablet.");render()}
      if(act==="sync"){setStatus("Sincronizando…");await syncAll();setStatus("Sincronizado.");render()}
      if(act==="fede"){
        setStatus("Buscando respuestas…");var q=await sb.from("respuestas_fede").select("id,created_at,data").order("created_at",{ascending:false});
        if(q.error)throw q.error;cloud.fede=q.data;S.view="fede";setStatus("");render();window.scrollTo(0,0)
      }
    }catch(e){cloud.msg="No se pudo completar. Revisá la conexión.";render()}
  }
  function fedeSum(d){var t=(d&&d.tasks)||[];return t.length+" tareas · "+fmt(sum(t,"minutos"))}
  function importFede(id){
    var row=(cloud.fede||[]).filter(function(x){return x.id===id})[0];if(!row)return;
    var d=row.data||{},p=newPerson("Federico","Administrador");
    p.tasks=(d.tasks||[]).map(function(t){var n=newTask();n.hora=t.hora||"";n.texto=t.texto||"";n.minutos=t.minutos||"";n.area=t.area||"";n.herr=t.herr||"";n.dec=t.dec||"";n.consec=t.nota||"";return n});
    var ex=[];if((d.ideal||[]).length){ex.push("Su día ideal:");d.ideal.forEach(function(i){ex.push("- "+(i.texto||"")+(i.minutos?" ("+fmt(+i.minutos)+")":""))})}
    var r=d.resp||{};
    if(r.mas_tiempo)ex.push("","Lo que más tiempo le lleva: "+r.mas_tiempo);
    if(r.dejar)ex.push("","Lo que dejaría o delegaría: "+r.dejar);
    if(r.ausencia)ex.push("","Qué pasa cuando no está: "+r.ausencia);
    p.ideas=ex.join("\n");
    S.people.push(p);S.cur=p.id;S.step=0;S.view="";save(p);render();window.scrollTo(0,0);
  }

  function stats(p){
    var tasks=p.tasks,d=tasks.filter(daily),total=sum(d,"minutos"),flags={doble:0,espera:0,traba:0,persona:0,manual:0},pasos=0,pasan=0,det=0,byArea={};
    tasks.forEach(function(t){if(t.pasos.length)det++;t.pasos.forEach(function(s){pasos++;if(s.pasa)pasan++;s.flags.forEach(function(f){flags[f]++})})});
    d.forEach(function(t){var a=t.area||"Sin grupo";byArea[a]=(byArea[a]||0)+(+t.minutos||0)});
    var rows=Object.keys(byArea).map(function(k){return {n:k,v:byArea[k]}}).sort(function(a,b){return b.v-a.v});
    var auto=tasks.filter(function(t){return t.dec==="auto"||t.pasos.some(function(s){return s.flags.indexOf("doble")>=0||s.flags.indexOf("manual")>=0})});
    var mov=sum(d.filter(function(t){return t.dec==="delego"||t.dec==="auto"||t.dec==="elimino"}),"minutos");
    return {total:total,flags:flags,pasos:pasos,pasan:pasan,det:det,rows:rows,auto:auto,pct:total?Math.round(mov/total*100):0,puntos:flags.doble+flags.espera+flags.traba+flags.persona+flags.manual};
  }
  function barList(rows){var max=Math.max.apply(null,rows.map(function(r){return r.v}).concat([1]));return rows.map(function(r){return '<div class="bar"><span>'+esc(r.n)+'</span><span class="tr"><span class="fl" style="display:block;width:'+Math.round(r.v/max*100)+'%"></span></span><span class="v">'+fmt(r.v)+'</span></div>'}).join("")}
  function viewStep3(p){
    var s=stats(p),h='<h2>Ficha de '+esc(p.nombre||"la persona")+'</h2><p class="lead">Resumen de lo que se cargó. Bajá el PDF para sumarlo al diagnóstico.</p>';
    if(!p.tasks.length)return h+'<div class="empty">Todavía no hay tareas cargadas.</div>'+navBtns(2,null);
    h+='<div class="grid2"><div class="stat"><span class="n">'+fmt(s.total)+'</span><span class="l">de tareas diarias cargadas</span></div>'+
      '<div class="stat"><span class="n">'+s.det+' de '+p.tasks.length+'</span><span class="l">tareas detalladas paso a paso</span></div>'+
      '<div class="stat"><span class="n">'+s.puntos+'</span><span class="l">puntos a mejorar marcados en los pasos</span></div></div>';
    if(s.rows.length)h+='<h3>Dónde se va el tiempo, por grupo de tareas</h3><div class="bars">'+barList(s.rows)+'</div>';
    h+='<h3>Lo que aparece en los pasos</h3><div class="bars">'+FLAGS.map(function(f){return '<div class="bar"><span>'+esc(f[1])+'</span><span class="tr"><span class="fl" style="display:block;width:'+(s.pasos?Math.round(s.flags[f[0]]/s.pasos*100):0)+'%"></span></span><span class="v">'+s.flags[f[0]]+' de '+s.pasos+'</span></div>'}).join("")+'</div>';
    h+='<h3>Candidatas a automatizar</h3>'+(s.auto.length?'<ul class="sumlist">'+s.auto.map(function(t){return '<li>'+esc(t.texto||"(sin descripción)")+'</li>'}).join("")+'</ul>':'<p class="note">Todavía ninguna.</p>');

  /* ---------- eventos ---------- */
  function tOf(el){var p=person(),b=el.closest("[data-tid]");if(!p||!b)return null;var id=b.getAttribute("data-tid");for(var i=0;i<p.tasks.length;i++)if(p.tasks[i].id===id)return p.tasks[i];return null}
  function openT(){var p=person();if(!p||!S.open)return null;for(var i=0;i<p.tasks.length;i++)if(p.tasks[i].id===S.open)return p.tasks[i];return null}
  function sOf(el){var t=openT(),b=el.closest("[data-sid]");if(!t||!b)return null;var id=b.getAttribute("data-sid");for(var i=0;i<t.pasos.length;i++)if(t.pasos[i].id===id)return {t:t,s:t.pasos[i],i:i};return null}
  $app.addEventListener("input",function(e){
    var el=e.target,p=person();if(!p)return;
    var pf=el.getAttribute("data-p");if(pf){p[pf]=el.value;save(p);return}
    var sf=el.getAttribute("data-sf");if(sf){var hs=sOf(el);if(hs){hs.s[sf]=el.value;save(p)}return}
    var tf=el.getAttribute("data-tf");if(tf){var b=el.closest("[data-tool]");var n=b.getAttribute("data-tool");p.tools[n]=p.tools[n]||{uso:"",falta:""};p.tools[n][tf]=el.value;save(p);return}
    var f=el.getAttribute("data-f");if(f){var t=tOf(el);if(t){t[f]=el.value;save(p)}}
  });
  $app.addEventListener("change",function(e){
    var el=e.target,p=person();if(!p)return;var sf=el.getAttribute("data-sf"),f=el.getAttribute("data-f");
    if(sf){var hs=sOf(el);if(hs){hs.s[sf]=el.value;save(p)}}else if(f){var t=tOf(el);if(t){t[f]=el.value;save(p)}}
  });
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]");if(!b)return;
    var act=b.getAttribute("data-act"),p=person();
    if(act==="home"){S.cur=null;S.open=null;S.view="";render();return}
    if(act.indexOf("c-")===0){
      if(act==="c-import"){importFede(b.getAttribute("data-rid"));return}
      cloudAct(act.slice(2),b);return;
    }
    if(act==="export"){
      var u=URL.createObjectURL(new Blob([JSON.stringify(S.people,null,1)],{type:"application/json"}));var a=document.createElement("a");a.href=u;a.download="relevamiento-roble-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},1500);return;
    }
    if(act==="import"){document.getElementById("impf").click();return}
    if(act==="open"){S.cur=b.getAttribute("data-pid");S.step=0;S.open=null;render();window.scrollTo(0,0);return}
    if(act==="addperson"){
      var n=document.getElementById("np-n").value.trim(),pu=document.getElementById("np-p").value.trim();
      if(!n){document.getElementById("np-n").focus();return}
      var np=newPerson(n,pu);S.people.push(np);S.cur=np.id;S.step=0;save(np);render();window.scrollTo(0,0);return;
    }
    if(!p)return;
    if(act==="delperson"){
      if(b.getAttribute("data-armed")!=="1"){b.setAttribute("data-armed","1");b.textContent="Tocá de nuevo para eliminar a "+(p.nombre||"esta persona");setTimeout(function(){b.removeAttribute("data-armed");b.textContent="Eliminar esta persona"},4000);return}
      S.people.splice(S.people.indexOf(p),1);S.cur=null;S.open=null;localSave();
      if(cloud.ok)sb.from("relevamientos").delete().eq("id",p.id).then(function(){});
      render();window.scrollTo(0,0);return;
    }
    if(act==="go"){go(+b.getAttribute("data-i"));return}
    if(act==="addtask"){var t=newTask();p.tasks.push(t);save(p);render("#t-"+t.id);return}
    if(act==="deltask"){
      var tt=tOf(b);if(!tt)return;
      if(S.armed!==tt.id){S.armed=tt.id;b.classList.add("armed");b.textContent="✓";clearTimeout(armTimer);armTimer=setTimeout(function(){S.armed=null;render()},2500);return}
      S.armed=null;p.tasks.splice(p.tasks.indexOf(tt),1);save(p);render();return;
    }
    if(act==="opentask"){S.open=b.getAttribute("data-tid");render();window.scrollTo(0,0);return}
    if(act==="closetask"){S.open=null;render();return}
    if(act==="addpaso"){var t2=openT();if(!t2)return;var s=newPaso();t2.pasos.push(s);save(p);render("#s-"+s.id);return}
    var hs=sOf(b);
    if(act==="delpaso"&&hs){
      if(S.armed!==hs.s.id){S.armed=hs.s.id;b.classList.add("armed");b.textContent="✓";clearTimeout(armTimer);armTimer=setTimeout(function(){S.armed=null;render()},2500);return}
      S.armed=null;hs.t.pasos.splice(hs.i,1);save(p);render();return;
    }
    if((act==="up"||act==="down")&&hs){var j=hs.i+(act==="up"?-1:1);if(j<0||j>=hs.t.pasos.length)return;var a=hs.t.pasos;var tmp=a[hs.i];a[hs.i]=a[j];a[j]=tmp;save(p);render();return}
    if(act==="flag"&&hs){var v=b.getAttribute("data-v"),k=hs.s.flags.indexOf(v);if(k>=0)hs.s.flags.splice(k,1);else hs.s.flags.push(v);save(p);b.setAttribute("aria-pressed",String(k<0));return}
    if(act==="dec"){var t3=tOf(b);if(!t3)return;var dv=b.getAttribute("data-v");t3.dec=t3.dec===dv?"":dv;save(p);b.parentNode.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(c.getAttribute("data-v")===t3.dec))});return}
    if(act==="uso"){var n2=b.closest("[data-tool]").getAttribute("data-tool");p.tools[n2]=p.tools[n2]||{uso:"",falta:""};var uv=b.getAttribute("data-v");p.tools[n2].uso=p.tools[n2].uso===uv?"":uv;save(p);b.parentNode.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(c.getAttribute("data-v")===p.tools[n2].uso))});return}
    if(act==="pdf"){downloadPdf(b,p);return}
  });

  document.addEventListener("change",function(e){
    if(e.target.id!=="impf"||!e.target.files[0])return;
    var rd=new FileReader();rd.onload=function(){
      try{var arr=JSON.parse(rd.result);if(!Array.isArray(arr))throw 0;mergeRemote(arr.filter(function(x){return x&&x.id&&Array.isArray(x.tasks)}));setStatus("Copia cargada.");render()}catch(err){setStatus("El archivo no es una copia válida.",true)}
    };rd.readAsText(e.target.files[0]);
  });

  /* ---------- PDF ---------- */
  function buildPdf(p){
    var PW=595,PH=842,M=48,CW=PW-2*M,TOP=112,BOT=64;
    var C={navy:"050A22",gray:"4A5068",orange:"FF861A",line:"D9DCE3",tint:"F1F4FA",blue:"1F5FD6",white:"FFFFFF"};
    function rgb(h){return (parseInt(h.slice(0,2),16)/255).toFixed(3)+" "+(parseInt(h.slice(2,4),16)/255).toFixed(3)+" "+(parseInt(h.slice(4,6),16)/255).toFixed(3)}
    function enc(t){return String(t).replace(/→/g,"->").replace(/[—–]/g,"-").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[^\x20-\x7E -ÿ]/g,"?").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
    var cv=document.createElement("canvas").getContext("2d");
    function mw(t,size,bold){try{cv.font=(bold?"bold ":"")+size+"px Arial, Helvetica, sans-serif";var w=cv.measureText(String(t)).width;if(w>0)return w}catch(e){}return String(t).length*size*(bold?0.58:0.53)}
    function wrap(t,size,bold,maxW){
      var out=[],cur="";
      String(t).split(/\s+/).forEach(function(w){
        while(mw(w,size,bold)>maxW&&w.length>1){var k=w.length;while(k>1&&mw(w.slice(0,k),size,bold)>maxW)k--;if(cur){out.push(cur);cur=""}out.push(w.slice(0,k));w=w.slice(k)}
        if(!cur)cur=w;else if(mw(cur+" "+w,size,bold)<=maxW)cur+=" "+w;else{out.push(cur);cur=w}
      });
      if(cur)out.push(cur);return out.length?out:[""];
    }
    var pages=[],cur=null,y=0,n=0;
    function put(s){cur.push(s)}
    function rect(x,yt,w,h,col){put(rgb(col)+" rg "+x.toFixed(1)+" "+(PH-yt-h).toFixed(1)+" "+w.toFixed(1)+" "+h.toFixed(1)+" re f")}
    function text(t,x,yt,size,o){
      o=o||{};var w=mw(t,size,o.bold),xx=o.align==="right"?x-w:o.align==="center"?x-w/2:x;
      put("BT /"+(o.bold?"F2":"F1")+" "+size+" Tf "+(o.sp||0)+" Tc "+rgb(o.color||C.navy)+" rg "+xx.toFixed(1)+" "+(PH-yt-size*0.8).toFixed(1)+" Td ("+enc(t)+") Tj ET");
    }
    function img(name,w,h,x,yt){put("q "+w.toFixed(1)+" 0 0 "+h.toFixed(1)+" "+x.toFixed(1)+" "+(PH-yt-h).toFixed(1)+" cm /"+name+" Do Q")}
    function newPage(){
      cur=[];pages.push(cur);n++;
      var hE=46,wE=hE*LOGO_E.w/LOGO_E.h,hR=34,wR=hR*LOGO_R.w/LOGO_R.h;
      img("Im1",wE,hE,M,28);img("Im2",wR,hR,PW-M-wR,34);
      rect(M,90,CW,0.7,C.line);
      text("Contacto: info@escalatecnica.com.ar / Tel: 1162299128",PW/2,PH-44,9,{align:"center",color:C.gray});
      text(String(n),PW-M,PH-44,9,{align:"right",color:C.gray});
      y=TOP;
    }
    function need(h){if(y+h>PH-BOT)newPage()}
    function heading(t,sub){
      need(48);y+=14;text(t,M,y,14,{bold:true});y+=20;
      if(sub){wrap(sub,9.5,false,CW).forEach(function(l){text(l,M,y,9.5,{color:C.gray});y+=13});}
      y+=4;
    }
    newPage();
    var s=stats(p);
    var fecha=new Date(p.fecha+"T12:00:00").toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"});
    text("RELEVAMIENTO DE PUESTO · ROBLE",M,y,8,{bold:true,color:C.blue,sp:1.2});y+=16;
    text(p.nombre||"Sin nombre",M,y,26,{bold:true});y+=34;
    text((p.puesto?p.puesto+" · ":"")+fecha,M,y,9.5,{color:C.gray});y+=18;
    rect(M,y,CW,2.2,C.orange);y+=14;
    var tiles=[[fmt(s.total),"de tareas diarias cargadas"],[s.det+" de "+p.tasks.length,"tareas detalladas paso a paso"],[String(s.puntos),"puntos a mejorar marcados en los pasos"]];
    var tg=6,tw=(CW-2*tg)/3,th=64;
    tiles.forEach(function(t,i){var x=M+i*(tw+tg);rect(x,y,tw,th,C.tint);text(t[0],x+12,y+10,22,{bold:true});
      wrap(t[1],8.5,false,tw-24).forEach(function(l,k){text(l,x+12,y+38+k*11,8.5,{color:C.gray})})});
    y+=th+6;
    function block(lines,x0,size,bold,color,gap){lines.forEach(function(l){need(size+4);text(l,x0,y,size,{bold:bold,color:color});y+=gap})}
    /* tareas */
    heading("Su día hoy","Las tareas en el orden en que pasan, con plazo y control.");
    var tasks=p.tasks.slice();sortTasks({tasks:tasks});
    tasks.forEach(function(t){
      var d=DEC.filter(function(x){return x[0]===t.dec})[0],tag=d?d[1]:"";
      var dl=wrap(t.texto||"(sin descripción)",10,true,CW-170);
      var meta=[t.minutos?fmt(+t.minutos):"",t.frec,t.area,t.herr].filter(Boolean).join(" · ");
      var ml=meta?wrap(meta,9,false,CW-170):[];
      var ctl=[t.plazo?"Plazo: "+t.plazo:"",t.aviso?"Se entera: "+t.aviso:""].filter(Boolean).join(" · ");
      var cl=ctl?wrap(ctl,9,false,CW-170):[];
      var kl=t.consec?wrap("Si no se hace: "+t.consec,9,false,CW-170):[];
      var h=10+dl.length*13+(ml.length+cl.length+kl.length)*12+10;
      need(h);rect(M,y,CW,0.6,C.line);
      text(t.hora||"--:--",M+2,y+10,10,{bold:true,color:C.blue});
      var yy=y+10;dl.forEach(function(l){text(l,M+52,yy,10,{bold:true});yy+=13});
      ml.concat(cl,kl).forEach(function(l){text(l,M+52,yy,9,{color:C.gray});yy+=12});
      if(tag)text(tag,PW-M-2,y+10,8.5,{bold:true,color:C.blue,align:"right"});
      y+=h;
    });
    rect(M,y,CW,0.6,C.line);y+=4;
    if(s.rows.length&&s.total){
      heading("Dónde se va el tiempo","Minutos por grupo de tareas, solo tareas diarias.");
      var max=Math.max.apply(null,s.rows.map(function(r){return r.v}).concat([1]));
      s.rows.forEach(function(r){need(20);text(r.n,M,y,9.5,{color:C.navy});
        rect(M+190,y+1,CW-190-70,8,C.tint);rect(M+190,y+1,Math.max(2,(CW-190-70)*r.v/max),8,C.blue);
        text(fmt(r.v),PW-M,y,9.5,{bold:true,color:C.gray,align:"right"});y+=20});
    }
    /* paso a paso */
    var det=tasks.filter(function(t){return t.pasos.length});
    if(det.length){
      heading("Paso a paso de las tareas","Cómo se hace cada tarea de principio a fin, con herramientas y puntos a mejorar.");
      det.forEach(function(t){
        need(60);y+=6;
        wrap(t.texto||"(sin descripción)",11,true,CW).forEach(function(l){text(l,M,y,11,{bold:true});y+=15});
        if(t.trigger){wrap("La dispara: "+t.trigger,9,false,CW).forEach(function(l){text(l,M,y,9,{color:C.gray});y+=12})}
        y+=3;
        t.pasos.forEach(function(st,i){
          var tl=wrap(st.texto||"(sin descripción)",10,false,CW-60);
          var m2=[st.herr,st.min?st.min+" min":"",st.pasa?"pasa a: "+st.pasa:""].filter(Boolean).join(" · ");
          var ml=m2?wrap(m2,9,false,CW-60):[];
          var fl=st.flags.length?wrap(st.flags.map(function(f){return FLAGS.filter(function(x){return x[0]===f})[0][1]}).join(" · "),8.5,true,CW-60):[];
          var nl=st.nota?wrap("“"+st.nota+"”",9,false,CW-60):[];
          var h=8+tl.length*13+(ml.length+nl.length)*12+fl.length*11+6;
          need(h);rect(M+14,y,CW-14,0.5,C.line);
          text(String(i+1),M+18,y+8,10,{bold:true,color:C.blue});
          var yy=y+8;tl.forEach(function(l){text(l,M+44,yy,10,{color:C.navy});yy+=13});
          ml.concat(nl).forEach(function(l){text(l,M+44,yy,9,{color:C.gray});yy+=12});
          fl.forEach(function(l){text(l,M+44,yy,8.5,{bold:true,color:C.orange});yy+=11});
          y+=h;
        });
        rect(M+14,y,CW-14,0.5,C.line);y+=4;
      });
    }
    /* herramientas */
    var tl2=toolsUsed(p);
    if(tl2.length){
      heading("Herramientas","Cómo usa cada una y qué le falta.");
      tl2.forEach(function(n){
        var u=p.tools[n]||{uso:"",falta:""},ud=USO.filter(function(x){return x[0]===u.uso})[0];
        var fl=u.falta?wrap(u.falta,9,false,CW-170):[],h=10+13+fl.length*12+8;
        need(h);rect(M,y,CW,0.6,C.line);text(n,M+2,y+10,10,{bold:true});
        if(ud)text(ud[1],PW-M-2,y+10,8.5,{bold:true,color:C.blue,align:"right"});
        var yy=y+23;fl.forEach(function(l){text(l,M+2,yy,9,{color:C.gray});yy+=12});y+=h;
      });
      rect(M,y,CW,0.6,C.line);y+=4;
    }
    if(s.auto.length){
      heading("Candidatas a automatizar","Marcadas como automatizables o con carga doble o manual repetitiva.");
      s.auto.forEach(function(t){wrap("- "+(t.texto||"(sin descripción)"),10,false,CW).forEach(function(l){need(14);text(l,M,y,10,{color:C.navy});y+=13})});
    }
    if(p.ideas){
      heading("Ideas, quejas o pedidos");
      wrap(p.ideas,10,false,CW-24).forEach(function(l){need(14);text(l,M,y,10,{color:C.navy});y+=13});
    }
    /* ensamblado */
    function b(str){var a=new Uint8Array(str.length);for(var i=0;i<str.length;i++)a[i]=str.charCodeAt(i)&255;return a}
    function unb64(x){var r=atob(x),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
    var objs=[];
    objs[1]=["<< /Type /Catalog /Pages 2 0 R >>"];
    var kids=[];for(var i=0;i<pages.length;i++)kids.push((7+i*2)+" 0 R");
    objs[2]=["<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+pages.length+" >>"];
    objs[3]=["<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"];
    objs[4]=["<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
    [LOGO_E,LOGO_R].forEach(function(L,k){var d=unb64(L.b);
      objs[5+k]=["<< /Type /XObject /Subtype /Image /Width "+L.w+" /Height "+L.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+d.length+" >>\nstream\n",d,"\nendstream"]});
    pages.forEach(function(p,i){
      var c=p.join("\n");
      objs[7+i*2]=["<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PW+" "+PH+"] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << /Im1 5 0 R /Im2 6 0 R >> >> /Contents "+(8+i*2)+" 0 R >>"];
      objs[8+i*2]=["<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream"];
    });
    var chunks=[],len=0,offs=[];
    function add(x){var a=typeof x==="string"?b(x):x;chunks.push(a);len+=a.length}
    add("%PDF-1.4\n");
    for(var k=1;k<objs.length;k++){offs[k]=len;add(k+" 0 obj\n");objs[k].forEach(add);add("\nendobj\n")}
    var xr=len,x="xref\n0 "+objs.length+"\n0000000000 65535 f \n";
    for(k=1;k<objs.length;k++)x+=("0000000000"+offs[k]).slice(-10)+" 00000 n \n";
    add(x+"trailer\n<< /Size "+objs.length+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
    var out=new Uint8Array(len),pos=0;chunks.forEach(function(a){out.set(a,pos);pos+=a.length});
    return out;
  }
  function downloadPdf(btn,p){
    var old=btn.textContent;
    function msg(t){btn.textContent=t;setTimeout(function(){btn.textContent=old},3500)}
    btn.disabled=true;btn.textContent="Preparando…";
    var fname="Relevamiento-"+(p.nombre||"puesto").replace(/[^\wÀ-ÿ]+/g,"-")+".pdf";
    (async function(){
      try{
        var dl=null;try{dl=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null}catch(_){dl=null}
        var bytes=buildPdf(p);
        if(dl){await dl.save({filename:fname,data:bytes})}
        else{var url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));var a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},1500)}
        msg("PDF descargado");
      }catch(e){
        if(e&&e.code==="declined"){btn.textContent=old}else msg("No se pudo generar el PDF"+(e&&(e.code||e.message)?" ("+(e.code||e.message)+")":""));
      }finally{btn.disabled=false}
    })();
  }

  /* ---------- arranque ---------- */
  try{var raw=localStorage.getItem(LS);if(raw)S.people=JSON.parse(raw)}catch(e){}
  render();
  conectar();
  document.addEventListener("visibilitychange",function(){if(!document.hidden)conectar()});
  window.addEventListener("online",conectar);
})();
</script>
