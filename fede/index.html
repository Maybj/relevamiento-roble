<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi día en Roble</title><meta name="theme-color" content="#050A22">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una columna angosta; cada tarea es una fila con su hora a la izquierda, como una agenda del día. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --ink:#0F1B3A; --muted:#566282; --line:#D7DEEB;
  --blue:#2270B4; --teal:#14806F; --accent:#C9511A; --on-accent:#FFFFFF; --soft:#E8EDF8; --warn:#A33A12;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1430; --surface:#111D3F; --ink:#EAEFFA; --muted:#9BA8C8; --line:#25345E;
    --blue:#74B4EC; --teal:#4CC9B0; --accent:#FF8A4C; --on-accent:#0A1430; --soft:#18264D; --warn:#FFA27A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1430; --surface:#111D3F; --ink:#EAEFFA; --muted:#9BA8C8; --line:#25345E;
  --blue:#74B4EC; --teal:#4CC9B0; --accent:#FF8A4C; --on-accent:#0A1430; --soft:#18264D; --warn:#FFA27A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(28px,6vw,40px);font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand .logo{background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;line-height:0}
.brand .logo img{height:40px;width:auto;max-width:100%}
.brand .by{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand .by b{color:var(--ink);font-weight:500}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:60ch}
header.top{display:flex;flex-direction:column;gap:10px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.step{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.step b{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.step span{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.step[aria-current="step"]{border-color:var(--blue);box-shadow:inset 0 -3px 0 var(--blue)}
.step:hover{border-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.status{font-size:13px;color:var(--muted);min-height:20px}
.status.err{color:var(--warn)}
.panel{display:flex;flex-direction:column;gap:16px}
.list{display:flex;flex-direction:column;gap:12px}
.task{display:grid;grid-template-columns:104px minmax(0,1fr) 36px;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative}
.task.example{border-style:dashed;background:transparent}
.badge{position:absolute;top:-10px;left:14px;background:var(--soft);color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.time{display:flex;flex-direction:column;gap:4px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:0}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type="time"]{font-family:var(--f-mono);font-size:16px}
textarea{min-height:84px;resize:vertical}
input:disabled,select:disabled{opacity:1;color:var(--ink)}
.x{align-self:start;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.x:hover{color:var(--warn);border-color:var(--warn)}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sumlist{margin:0 0 8px;padding-left:20px}.sumlist li{margin:4px 0}.sumtxt{white-space:pre-wrap;margin:0 0 8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.05)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:8px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted)}
.task2{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.t2head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.t2head .h{font-family:var(--f-mono);font-size:14px;color:var(--blue)}
.t2head .d{font-weight:600;overflow-wrap:anywhere;flex:1 1 220px}
.meta{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--bg);font-weight:600}
.q{display:flex;flex-direction:column;gap:6px}
.q label{font-size:15px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.bar{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:14px}
.bar .nm{overflow-wrap:anywhere}
.bar .tr{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar .fl{height:100%;border-radius:6px;min-width:2px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.ok{background:var(--soft);border-radius:12px;padding:14px;font-weight:500}
.note{font-size:13px;color:var(--muted)}
@media (max-width:560px){
  .steps{grid-template-columns:repeat(2,1fr)}
  .task{grid-template-columns:minmax(0,1fr) 36px}
  .time{grid-column:1/2}
  .fields{grid-column:1/2}
  .task .x{grid-column:2;grid-row:1}
  .bar{grid-template-columns:minmax(0,1fr) 70px}
  .bar .tr{grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion:no-preference){.fl{transition:width .3s}}
</style></head><body>

    <p class="lead">Contá cómo es tu día hoy y cómo te gustaría que fuera. Lleva unos 15 minutos y no hay respuestas correctas. Lo que escribís se guarda solo en este dispositivo y se lo mandás a Mayra al final.</p>

  function barList(rows,color){

  function summaryData(){
    var total=sum(state.tasks),byArea={},byDec={yo:0,delego:0,auto:0,elimino:0,sin:0};
    state.tasks.forEach(function(t){var m=+t.minutos||0;var a=t.area||"Sin área";byArea[a]=(byArea[a]||0)+m;byDec[t.dec||"sin"]+=m});
    var rows=Object.keys(byArea).map(function(k){return {n:k,v:byArea[k]}}).sort(function(a,b){return b.v-a.v});
    var movable=byDec.delego+byDec.auto+byDec.elimino;
    return {total:total,rows:rows,byDec:byDec,movable:movable,pct:total?Math.round(movable/total*100):0,ideal:sum(state.ideal)};

  /* ---------- eventos ---------- */
  function findItem(el){
    var box=el.closest("[data-list]");if(!box)return null;
    var list=state[box.getAttribute("data-list")];var id=box.getAttribute("data-id");
    for(var i=0;i<list.length;i++)if(list[i].id===id)return {list:list,item:list[i],idx:i,box:box};
    return null;
  }
  $panel.addEventListener("input",function(e){
    var el=e.target;
    if(el.hasAttribute("data-q")){state.resp[el.getAttribute("data-q")]=el.value;scheduleSave();return}
    var f=el.getAttribute("data-f");if(!f)return;
    var hit=findItem(el);if(!hit)return;
    hit.item[f]=el.value;scheduleSave();
  });
  $panel.addEventListener("change",function(e){
    var el=e.target,f=el.getAttribute&&el.getAttribute("data-f");if(!f)return;
    var hit=findItem(el);if(!hit)return;hit.item[f]=el.value;scheduleSave();
  });
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]");if(!b)return;
    var act=b.getAttribute("data-act");
    if(act==="go"){go(+b.getAttribute("data-i"));return}
    if(act==="add"){
      var l=b.getAttribute("data-list"),it=l==="tasks"?newTask():newIdeal();state[l].push(it);scheduleSave();
      render((l==="tasks"?"#t-":"#it-")+it.id);return;
    }
    if(act==="del"){
      var hit=findItem(b);if(!hit)return;hit.list.splice(hit.idx,1);scheduleSave();render();return;
    }
    if(act==="dec"){
      var h2=findItem(b);if(!h2)return;var v=b.getAttribute("data-v");
      h2.item.dec=h2.item.dec===v?"":v;scheduleSave();
      h2.box.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(c.getAttribute("data-v")===h2.item.dec))});return;
    }
    if(act==="send"){
      state.enviado=true;state.enviadoAt=new Date().toISOString();localDraft();
      setStatus("Guardando…");clearTimeout(timer);flush().then(function(){render()});return;
    }
    if(act==="sbsend"){sendToMayra(b);return}
    if(act==="reset"){
      if(b.getAttribute("data-armed")!=="1"){b.setAttribute("data-armed","1");b.textContent="Tocá de nuevo para borrar todo";setTimeout(function(){b.removeAttribute("data-armed");b.textContent="Borrar todo y empezar de cero"},4000);return}
      state.tasks=[];state.ideal=[];state.resp={mas_tiempo:"",dejar:"",ausencia:""};state.enviado=false;state.enviadoAt=null;state.step=0;
      try{localStorage.removeItem("roble-mi-dia")}catch(e){}
      touched=true;if(doc)scheduleSave();setStatus("Se borró todo.");render();window.scrollTo(0,0);return;
    }
    if(act==="pdf"){downloadPdf(b);return}
  });

  function buildPdf(){
    var PW=595,PH=842,M=48,CW=PW-2*M,TOP=112,BOT=64;
    var C={navy:"050A22",gray:"4A5068",orange:"FF861A",line:"D9DCE3",tint:"F1F4FA",blue:"1F5FD6",white:"FFFFFF"};
    function rgb(h){return (parseInt(h.slice(0,2),16)/255).toFixed(3)+" "+(parseInt(h.slice(2,4),16)/255).toFixed(3)+" "+(parseInt(h.slice(4,6),16)/255).toFixed(3)}
    function enc(t){return String(t).replace(/→/g,"->").replace(/[—–]/g,"-").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[^\x20-\x7E -ÿ]/g,"?").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
    var cv=document.createElement("canvas").getContext("2d");
    function mw(t,size,bold){try{cv.font=(bold?"bold ":"")+size+"px Arial, Helvetica, sans-serif";var w=cv.measureText(String(t)).width;if(w>0)return w}catch(e){}return String(t).length*size*(bold?0.58:0.53)}
    function wrap(t,size,bold,maxW){
      var out=[],cur="";
      String(t).split(/\s+/).forEach(function(w){
        while(mw(w,size,bold)>maxW&&w.length>1){var k=w.length;while(k>1&&mw(w.slice(0,k),size,bold)>maxW)k--;if(cur){out.push(cur);cur=""}out.push(w.slice(0,k));w=w.slice(k)}
        if(!cur)cur=w;else if(mw(cur+" "+w,size,bold)<=maxW)cur+=" "+w;else{out.push(cur);cur=w}
      });
      if(cur)out.push(cur);return out.length?out:[""];
    }
    var pages=[],cur=null,y=0,n=0;
    function put(s){cur.push(s)}
    function rect(x,yt,w,h,col){put(rgb(col)+" rg "+x.toFixed(1)+" "+(PH-yt-h).toFixed(1)+" "+w.toFixed(1)+" "+h.toFixed(1)+" re f")}
    function text(t,x,yt,size,o){
      o=o||{};var w=mw(t,size,o.bold),xx=o.align==="right"?x-w:o.align==="center"?x-w/2:x;
      put("BT /"+(o.bold?"F2":"F1")+" "+size+" Tf "+(o.sp||0)+" Tc "+rgb(o.color||C.navy)+" rg "+xx.toFixed(1)+" "+(PH-yt-size*0.8).toFixed(1)+" Td ("+enc(t)+") Tj ET");
    }
    function img(name,w,h,x,yt){put("q "+w.toFixed(1)+" 0 0 "+h.toFixed(1)+" "+x.toFixed(1)+" "+(PH-yt-h).toFixed(1)+" cm /"+name+" Do Q")}
    function newPage(){
      cur=[];pages.push(cur);n++;
      var hE=46,wE=hE*LOGO_E.w/LOGO_E.h,hR=34,wR=hR*LOGO_R.w/LOGO_R.h;
      img("Im1",wE,hE,M,28);img("Im2",wR,hR,PW-M-wR,34);
      rect(M,90,CW,0.7,C.line);
      text("Contacto: info@escalatecnica.com.ar / Tel: 1162299128",PW/2,PH-44,9,{align:"center",color:C.gray});
      text(String(n),PW-M,PH-44,9,{align:"right",color:C.gray});
      y=TOP;
    }
    function need(h){if(y+h>PH-BOT)newPage()}
    function heading(t,sub){
      need(90);y+=14;text(t,M,y,14,{bold:true});y+=20;
      if(sub){wrap(sub,9.5,false,CW).forEach(function(l){text(l,M,y,9.5,{color:C.gray});y+=13});}
      y+=4;
    }
    newPage();
    var s=summaryData();
    var fecha=new Date().toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"});
    text("RELEVAMIENTO · MI DÍA EN ROBLE",M,y,8,{bold:true,color:C.blue,sp:1.2});y+=16;
    text("Mi día en Roble",M,y,26,{bold:true});y+=34;
    text("Mi día de hoy y mi día ideal, en mis palabras · "+fecha,M,y,9.5,{color:C.gray});y+=18;
    rect(M,y,CW,2.2,C.orange);y+=14;
    /* cifras */
    var tiles=[[fmt(s.total),"de tareas cargadas en un día"],[s.pct+"%","lo delegaría, automatizaría o eliminaría"],[fmt(s.ideal),"que quisiera dedicar a mi día ideal"]];
    var tg=6,tw=(CW-2*tg)/3,th=64;
    tiles.forEach(function(t,i){var x=M+i*(tw+tg);rect(x,y,tw,th,C.tint);text(t[0],x+12,y+10,22,{bold:true});
      wrap(t[1],8.5,false,tw-24).forEach(function(l,k){text(l,x+12,y+38+k*11,8.5,{color:C.gray})})});
    y+=th+6;
    /* mi dia hoy */
    heading("Mi día hoy","Las tareas que hago en un día normal, en el orden en que pasan.");
    var tasks=state.tasks.slice();
    if(!tasks.length){text("No cargué tareas.",M,y,10,{color:C.gray});y+=18}
    tasks.forEach(function(t){
      var d=DEC.filter(function(x){return x[0]===t.dec})[0];
      var tag=d?d[1]:"";
      var dl=wrap(t.texto||"(sin descripción)",10,true,CW-150);
      var meta=[t.minutos?fmt(+t.minutos):"",t.area,t.herr].filter(Boolean).join(" · ");
      var ml=meta?wrap(meta,9,false,CW-150):[];
      var nl=t.nota?wrap("“"+t.nota+"”",9,false,CW-150):[];
      var h=10+dl.length*13+ml.length*12+nl.length*12+10;
      need(h);
      rect(M,y,CW,0.6,C.line);
      text(t.hora||"--:--",M+2,y+10,10,{bold:true,color:C.blue});

    function b(str){var a=new Uint8Array(str.length);for(var i=0;i<str.length;i++)a[i]=str.charCodeAt(i)&255;return a}
    function unb64(x){var r=atob(x),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
    var objs=[];
    objs[1]=["<< /Type /Catalog /Pages 2 0 R >>"];
    var kids=[];for(var i=0;i<pages.length;i++)kids.push((7+i*2)+" 0 R");
    objs[2]=["<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+pages.length+" >>"];

    [LOGO_E,LOGO_R].forEach(function(L,k){var d=unb64(L.b);

    pages.forEach(function(p,i){

      objs[8+i*2]=["<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream"];
    });
    var chunks=[],len=0,offs=[];
    function add(x){var a=typeof x==="string"?b(x):x;chunks.push(a);len+=a.length}
    add("%PDF-1.4\n");
    for(var k=1;k<objs.length;k++){offs[k]=len;add(k+" 0 obj\n");objs[k].forEach(add);add("\nendobj\n")}
    var xr=len,x="xref\n0 "+objs.length+"\n0000000000 65535 f \n";
    for(k=1;k<objs.length;k++)x+=("0000000000"+offs[k]).slice(-10)+" 00000 n \n";
    add(x+"trailer\n<< /Size "+objs.length+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
    var out=new Uint8Array(len),pos=0;chunks.forEach(function(a){out.set(a,pos);pos+=a.length});
    return out;
